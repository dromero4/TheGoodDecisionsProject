services:

  postgres:
    image: postgres:18.3-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=stackdb
      - POSTGRES_PASSWORD=stackpass
      - POSTGRES_USER=stackuser
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - stack-network

volumes:
  postgres-data:
    driver: local

networks:
  stack-network: